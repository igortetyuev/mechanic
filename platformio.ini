; Таймграфер: ESP32-WROOM-32 + INMP441 (I2S)
; Сборка и заливка:  pio run -e esp32dev -t upload && pio device monitor
; Хостовый тест DSP: pio test -e native

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native@^1.1.3
build_src_filter = +<tickdsp.cpp> +<rateest.cpp>
test_build_src = true
test_framework = unity
